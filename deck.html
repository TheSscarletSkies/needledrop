<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:" />
    <title>Needledrop</title>
    <style>
      /* A small box: the deck seen from above, and the player under it. The window itself is
         frosted glass on macOS (native vibrancy); elsewhere we paint the glass. */
      :root { --ink: #f4eee6; --ink-2: rgba(244, 238, 230, 0.62); --ink-3: rgba(244, 238, 230, 0.36); --tint: transparent; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; overflow: hidden; background: transparent; user-select: none; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; color: var(--ink); }
      .card { position: relative; display: flex; flex-direction: column; height: 100%; border-radius: 18px; overflow: hidden; }
      .card::before { content: ''; position: absolute; inset: 0; background: var(--tint); opacity: 0.22; transition: background 1s; pointer-events: none; }
      body.os-other .card { background: rgba(26, 22, 19, 0.86); border: 1px solid rgba(255, 255, 255, 0.08); }

      .stage { position: relative; flex: 1; min-height: 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      canvas.grab { cursor: grab; } canvas.grabbing { cursor: grabbing; } canvas.pointer { cursor: pointer; } canvas.move { cursor: move; }

      .player { position: relative; padding: 2px 18px 14px; -webkit-app-region: drag; }
      .meta { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
      .title { flex: 1; min-width: 0; font-family: 'Iowan Old Style', 'Palatino', Georgia, serif; font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .artist { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .seek { position: relative; height: 14px; margin: 6px 0 2px; cursor: pointer; -webkit-app-region: no-drag; }
      .seek::before { content: ''; position: absolute; left: 0; right: 0; top: 6px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, 0.12); }
      .seek i { position: absolute; left: 0; right: 0; top: 6px; height: 2px; border-radius: 1px; background: var(--ink-2); transform-origin: left; transform: scaleX(0); transition: transform 0.3s linear; }
      .seek:hover i { background: var(--ink); }
      .controls { display: flex; justify-content: center; align-items: center; gap: 14px; }
      button { -webkit-app-region: no-drag; font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      .controls button { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); transition: color 0.15s, background 0.15s; }
      .controls button:hover { color: var(--ink); background: rgba(255, 255, 255, 0.08); }
      .controls button.play { width: 36px; height: 36px; background: var(--ink); color: #1a1512; }
      .controls button.play:hover { background: #fff; color: #1a1512; }
      .controls svg { width: 16px; height: 16px; fill: currentColor; }

      #close {
        position: absolute; top: 10px; right: 10px; z-index: 2; width: 20px; height: 20px; border-radius: 50%;
        display: grid; place-items: center; background: rgba(20, 16, 14, 0.6); color: var(--ink); font: 13px/1 -apple-system, sans-serif;
        opacity: 0; transition: opacity 0.2s;
      }
      body:hover #close { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="card">
      <button id="close" aria-label="Close widget" title="Close">×</button>
      <div class="stage"><canvas id="scene"></canvas></div>
      <div class="player">
        <div class="title" id="title">Nothing playing</div>
        <div class="artist" id="artist"></div>
        <div class="seek" id="seek" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100"><i id="bar"></i></div>
        <div class="controls">
          <button data-cmd="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM19 6v12l-9-6z"/></svg></button>
          <button data-cmd="toggle" class="play" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path id="pp" d="M8 5v14l11-7z"/></svg></button>
          <button data-cmd="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM5 6v12l9-6z"/></svg></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/deckWidget.js"></script>
  </body>
</html>

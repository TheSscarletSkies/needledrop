# Builds installers for macOS, Windows and Linux when a version tag is pushed (e.g. v0.2.0),
# and attaches them to a draft GitHub release for that tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # lets the build prove which workflow made it
  attestations: write  # publishes those proofs (build attestations)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: |
              release.noindex/*.dmg
              release.noindex/*.zip
          - os: windows-latest
            target: --win
            files: release.noindex/*.exe
          - os: ubuntu-latest
            target: --linux
            files: |
              release.noindex/*.AppImage
              release.noindex/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Signed proof that each download was built here, from this tag's public code.
      # Anyone can check it with: gh attestation verify <file> --repo TheSscarletSkies/needledrop
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.files }}
